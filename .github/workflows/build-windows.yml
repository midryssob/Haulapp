name: Sestavení pro Windows

on:
  push:
    branches: [main]
    tags: ['v*', 'Hauling_Pyro_*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalace Tauri CLI
        run: npm install

      - name: Sestavení instalátoru
        run: npx tauri build

      - name: Uložení instalátorů jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: hauling-pyro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Vydání (jen při značce verze)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
