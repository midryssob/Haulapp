name: Sestavení pro Windows

on:
  push:
    branches: [main]
    tags: ['v*', 'Hauling_Pyro_*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalace Tauri CLI
        run: npm install

      - name: Sestavení instalátoru
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            echo "::warning::Chybí secret TAURI_SIGNING_PRIVATE_KEY – sestavuji bez podepsaných aktualizací"
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: latest.json pro automatické aktualizace
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/latest-json.mjs "${{ github.ref_name }}"

      - name: Uložení instalátorů jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: hauling-pyro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Vydání (jen při značce verze)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/msi/*.msi
