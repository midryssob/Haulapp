[package]
name = "hauling-pyro"
version = "1.1.0"
description = "Hauling Pyro – evidence nákladu a plánovač trasy pro Star Citizen"
edition = "2021"

[lib]
name = "hauling_pyro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
